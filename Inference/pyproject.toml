[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esmcapsid-inference"
version = "0.1.0"
description = "Independent ESM-only inference for the public ESMCapsid release"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2,<3",
  "transformers==4.48.1",
  "huggingface-hub>=0.26,<1",
  "einops>=0.7,<1",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
esmcapsid = "esmcapsid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
